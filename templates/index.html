<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMatch AI - Recomendador</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-10 font-sans">
    <div class="max-w-xl mx-auto">
        <h1 class="text-4xl font-bold text-green-500 mb-2">VibeMatch AI</h1>
        <p class="text-gray-400 mb-8">Selecciona cómo te sientes y deja que la lógica de Prolog haga el resto.</p>

        <form method="POST" class="flex gap-2 mb-10">
            <select name="vibra" class="flex-1 bg-gray-900 border border-gray-700 p-3 rounded-lg text-white focus:outline-none focus:border-green-500 cursor-pointer">
                <option value="estudio">🧠 Estudio / Concentración</option>
                <option value="chill">🧊 Chill / Relajado</option>
                <option value="gym">🏋️ Gym / Ejercicio</option>
                <option value="fiesta">🔥 Fiesta / Antro</option>
                <option value="gaming">🎮 Gaming / Videojuegos</option>
                <option value="triste">🌧️ Triste / Melancolía</option>
                <option value="romance">❤️ Romance / Amor</option>
                <option value="nostalgia">📼 Nostalgia retro</option>
                <option value="carretera">🚗 Viaje en carretera</option>
            </select>
            <button type="submit" class="bg-green-500 text-black font-bold px-6 py-3 rounded-lg hover:bg-green-400 transition">Buscar</button>
        </form>

        {% if canciones %}
        <h2 class="text-xl mb-4 text-gray-300 italic">Recomendaciones para "{{ vibra }}":</h2>
        <div class="space-y-4">
            {% for c in canciones %}
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 hover:scale-105 transition transform">
                <p class="font-bold text-lg">{{ c.titulo }}</p>
                <p class="text-green-400 text-sm">{{ c.artista }}</p>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
